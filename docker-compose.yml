version: '3.8'

services:
  cima-web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
